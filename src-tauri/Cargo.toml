[package]
name = "pc-manager"
version = "1.0.4"
description = "PC Manager — nhẹ, nhanh, an toàn"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[lib]
name = "pc_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Wrapper registry an toàn của dự án windows-rs (cùng windows-core 0.61).
windows-registry = "0.5"
toml = { version = "0.8", default-features = false, features = ["parse"] }
rayon = "1"
# WebView2: hạ mức dùng RAM của giao diện khi cửa sổ không được dùng (MemoryUsageTargetLevel).
# Cùng phiên bản Tauri đang dùng; windows-core 0.62 là bản webview2-com cần (đặt tên khác để không lẫn 0.61).
webview2-com = "0.39"
windows-core-062 = { package = "windows-core", version = "0.62" }
jwalk = "0.8"
blake3 = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_WinTrust",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_TaskScheduler",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_Services",
  "Win32_System_RemoteDesktop",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (không phải abort): lỗi trong một tác vụ chỉ làm hỏng tác vụ đó, không làm sập cả app.
panic = "unwind"
strip = true
