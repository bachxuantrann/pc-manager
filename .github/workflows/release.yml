# Push tag v* (vd `git tag -a v1.0.1 -m "..." && git push origin v1.0.1`) => kiểm tra, build bộ cài,
# tạo GitHub Release kèm bộ cài + SHA-256.
#
# Ký số (tuỳ chọn): nếu repo có secret SIGNING_PFX_BASE64 + SIGNING_PFX_PASSWORD (tạo bằng
# scripts/new-ci-signing-cert.ps1), bộ cài được ký bằng chứng chỉ tự ký đó; không có thì phát hành bản chưa ký.
#
# Tự cập nhật (tuỳ chọn): nếu repo có secret TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# tạo bằng scripts/new-updater-key.ps1), CI ký bộ cài bằng khoá minisign đó và đăng thêm latest.json — app đã cài
# đọc file này để thấy bản mới. Không có secret => phát hành như cũ, app không tự cập nhật lên bản này được.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build và phát hành
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag phải khớp phiên bản trong package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag v$tag khác phiên bản package.json ($pkg). Đổi phiên bản rồi tag lại." }
          $cl = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($cl -notmatch ('(?m)^## \[' + [regex]::Escape($tag) + '\]')) { throw "CHANGELOG.md chưa có mục ## [$tag] — thêm ghi chú phiên bản rồi tag lại." }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Kiểm tra (build giao diện, clippy, test)
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location src-tauri
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Nạp chứng chỉ ký (nếu có secret)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          Remove-Item $pfx -Force

      - name: Build bộ cài
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $cfg = @()
          if ($env:HAS_CERT -eq 'true') { $cfg += @('--config', 'src-tauri/tauri.sign.conf.json') }
          if ($env:HAS_UPDATER_KEY -eq 'true') {
            # Khoá công khai trong tauri.conf.json phải là của khoá riêng này (app đã cài dùng nó để kiểm chữ ký).
            $pub = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).plugins.updater.pubkey
            if (-not $pub -or $pub -like '*CHUA_CO_KHOA*') { throw "Có secret TAURI_SIGNING_PRIVATE_KEY nhưng tauri.conf.json chưa có pubkey — chạy scripts/new-updater-key.ps1 rồi commit." }
            $cfg += @('--config', 'src-tauri/tauri.updater.conf.json')
          }
          npx tauri build @cfg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Tạo Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $asset = Join-Path $env:RUNNER_TEMP "PC-Manager_${ver}_x64-setup.exe"
          Copy-Item $src.FullName $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          $signed = (Get-AuthenticodeSignature $asset).SignerCertificate -ne $null
          $signNote = if ($signed) {
            'Bộ cài được ký bằng **chứng chỉ tự ký** (không phải chứng chỉ được Windows tin cậy), nên SmartScreen có thể cảnh báo: bấm **More info → Run anyway**.'
          } else {
            'Bộ cài **chưa ký số**, nên SmartScreen sẽ cảnh báo: bấm **More info → Run anyway**. Nếu không yên tâm, bạn có thể tự build từ mã nguồn.'
          }
          $notes = @"
          ## Cài đặt
          1. Tải **PC-Manager_${ver}_x64-setup.exe** bên dưới và chạy (cài vào Program Files; cài đè lên bản cũ được, cài đặt và nhật ký giữ nguyên).
          2. $signNote
          3. App mở với quyền thường; chức năng cần quyền admin có nút "Chạy với quyền Administrator".

          SHA-256: ``$hash``

          An toàn và quyền admin: [docs/AN-TOAN.md](https://github.com/${{ github.repository }}/blob/$tag/docs/AN-TOAN.md). Yêu cầu Windows 10/11 x64.
          "@
          # "Có gì mới" = mục của phiên bản này trong CHANGELOG.md.
          $cl = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($cl, '(?ms)^## \[' + [regex]::Escape($ver) + '\][^\n]*\n(.*?)(?=^## \[|\z)')
          $changes = if ($m.Success) { "## Có gì mới`n`n" + $m.Groups[1].Value.Trim() + "`n`n" } else { "" }
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          [IO.File]::WriteAllText($notesFile, $changes + ($notes -replace '(?m)^          ', ''))
          $assets = @($asset)
          # latest.json cho trình cập nhật trong app: phiên bản, "Có gì mới", link bộ cài và chữ ký minisign của nó.
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            $relNotes = ""
            if ($m.Success) { $relNotes = $m.Groups[1].Value.Trim() }
            $latest = [ordered]@{
              version   = $ver
              notes     = $relNotes
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = (Get-Content $sig.FullName -Raw).Trim()
                  url       = "https://github.com/${{ github.repository }}/releases/download/$tag/PC-Manager_${ver}_x64-setup.exe"
                }
              }
            }
            $latestFile = Join-Path $env:RUNNER_TEMP "latest.json"
            [IO.File]::WriteAllText($latestFile, ($latest | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
            $assets += $latestFile
          } else {
            Write-Host "::warning::Không có chữ ký cập nhật (thiếu secret TAURI_SIGNING_PRIVATE_KEY) — bản này không có latest.json."
          }
          gh release create $tag @assets --title "PC Manager $tag" --notes-file $notesFile --generate-notes --verify-tag
