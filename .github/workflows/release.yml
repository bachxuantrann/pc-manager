# Push tag v* (vd `git tag -a v1.0.1 -m "..." && git push origin v1.0.1`) => kiểm tra, build bộ cài,
# tạo GitHub Release kèm bộ cài + SHA-256.
#
# Ký số (tuỳ chọn): nếu repo có secret SIGNING_PFX_BASE64 + SIGNING_PFX_PASSWORD (tạo bằng
# scripts/new-ci-signing-cert.ps1), bộ cài được ký bằng chứng chỉ tự ký đó; không có thì phát hành bản chưa ký.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build và phát hành
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag phải khớp phiên bản trong package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag v$tag khác phiên bản package.json ($pkg). Đổi phiên bản rồi tag lại." }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Kiểm tra (build giao diện, clippy, test)
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location src-tauri
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Nạp chứng chỉ ký (nếu có secret)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          Remove-Item $pfx -Force

      - name: Build bộ cài (có ký)
        if: env.HAS_CERT == 'true'
        run: npm run build:signed

      - name: Build bộ cài (chưa ký)
        if: env.HAS_CERT != 'true'
        run: npm run tauri build

      - name: Tạo Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $src = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $asset = Join-Path $env:RUNNER_TEMP "PC-Manager_${ver}_x64-setup.exe"
          Copy-Item $src.FullName $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          $signed = (Get-AuthenticodeSignature $asset).SignerCertificate -ne $null
          $signNote = if ($signed) {
            'Bộ cài được ký bằng **chứng chỉ tự ký** (không phải chứng chỉ được Windows tin cậy), nên SmartScreen có thể cảnh báo: bấm **More info → Run anyway**.'
          } else {
            'Bộ cài **chưa ký số**, nên SmartScreen sẽ cảnh báo: bấm **More info → Run anyway**. Nếu không yên tâm, bạn có thể tự build từ mã nguồn.'
          }
          $notes = @"
          ## Cài đặt
          1. Tải **PC-Manager_${ver}_x64-setup.exe** bên dưới và chạy (cài vào Program Files; cài đè lên bản cũ được, cài đặt và nhật ký giữ nguyên).
          2. $signNote
          3. App mở với quyền thường; chức năng cần quyền admin có nút "Chạy với quyền Administrator".

          SHA-256: ``$hash``

          An toàn và quyền admin: [docs/AN-TOAN.md](https://github.com/${{ github.repository }}/blob/$tag/docs/AN-TOAN.md). Yêu cầu Windows 10/11 x64.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          [IO.File]::WriteAllText($notesFile, ($notes -replace '(?m)^          ', ''))
          gh release create $tag $asset --title "PC Manager $tag" --notes-file $notesFile --generate-notes --verify-tag
