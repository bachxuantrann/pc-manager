# Mỗi lần push lên main / mở PR: kiểm tra nhanh (build giao diện, clippy, test).
# Không build bộ cài ở đây: bản release (LTO fat) mất ~6 phút. Bộ cài chỉ build khi push tag v*
# (release.yml), hoặc build trên máy bằng `npm run tauri build`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Kiểm tra (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài thư viện frontend
        run: npm ci

      - name: Build giao diện (tsc + vite)
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (bỏ qua test cần quyền Administrator)
        working-directory: src-tauri
        run: cargo test
